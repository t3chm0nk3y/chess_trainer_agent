name: pattern_synthesis
description: Cross-game pattern recognition and clustering
trigger: manual
version: 1

parameters:
  - name: min_games
    type: integer
    required: false
    default: 5

steps:
  - number: 1
    tool: database.query_analyzed_games
    description: Query all analyzed games from database
    input_map:
      min_games: "{{ min_games }}"

  - number: 2
    tool: pattern_engine.aggregate_mistakes
    description: Aggregate mistake statistics by phase, type, and eval delta
    input_map:
      games: "{{ step_1.games }}"

  - number: 3
    tool: pattern_engine.build_summary
    description: Build structured mistake summary for Claude
    input_map:
      statistics: "{{ step_2.statistics }}"

  - number: 4
    tool: claude.synthesize_patterns
    description: Send to Claude with pattern-synthesis prompt
    input_map:
      summary: "{{ step_3.summary }}"
      existing_patterns: "{{ step_1.existing_patterns }}"

  - number: 5
    tool: pattern_engine.diff_patterns
    description: Diff against existing patterns (new, updated, resolved)
    input_map:
      new_patterns: "{{ step_4.patterns }}"
      existing_patterns: "{{ step_1.existing_patterns }}"

  - number: 6
    tool: database.update_patterns
    description: Update patterns table
    input_map:
      pattern_changes: "{{ step_5.changes }}"

  - number: 7
    tool: progress.create_snapshot
    description: Generate progress snapshot
    input_map: {}

outputs:
  - patterns
  - progress_snapshot
