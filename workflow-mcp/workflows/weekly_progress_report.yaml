name: weekly_progress_report
description: Generate a progress report for a given time period
trigger: scheduled
version: 1

parameters:
  - name: period_days
    type: integer
    required: false
    default: 7

steps:
  - number: 1
    tool: database.fetch_recent_games
    description: Fetch games from the last N days
    input_map:
      days: "{{ period_days }}"

  - number: 2
    tool: progress.calculate_accuracy
    description: Calculate accuracy metrics for the period
    input_map:
      games: "{{ step_1.games }}"

  - number: 3
    tool: progress.compare_patterns
    description: Compare pattern severities vs previous period
    input_map:
      current_stats: "{{ step_2.stats }}"
      period_days: "{{ period_days }}"

  - number: 4
    tool: progress.identify_trends
    description: Identify top-improving and top-regressing patterns
    input_map:
      comparison: "{{ step_3.comparison }}"

  - number: 5
    tool: claude.generate_summary
    description: Generate natural language summary via Claude
    input_map:
      accuracy: "{{ step_2.stats }}"
      trends: "{{ step_4.trends }}"

  - number: 6
    tool: progress.create_snapshot
    description: Store progress snapshot
    input_map:
      summary: "{{ step_5.summary }}"

outputs:
  - progress_report
  - snapshot
