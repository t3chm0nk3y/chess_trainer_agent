name: new_game_comparison
description: Analyze a new game and compare against known patterns
trigger: manual
version: 1

parameters:
  - name: game_id
    type: string
    required: true

steps:
  - number: 1
    tool: workflow.execute
    description: Run full_game_analysis workflow on the new game
    input_map:
      workflow_name: full_game_analysis
      params:
        game_id: "{{ game_id }}"

  - number: 2
    tool: database.fetch_patterns
    description: Fetch current pattern definitions from database
    input_map: {}

  - number: 3
    tool: claude.compare_new_game
    description: Send new game mistakes + existing patterns to Claude
    input_map:
      game_mistakes: "{{ step_1.mistakes }}"
      known_patterns: "{{ step_2.patterns }}"

  - number: 4
    tool: database.update_pattern_frequencies
    description: Update pattern frequencies and last_seen dates
    input_map:
      matches: "{{ step_3.matched_patterns }}"

  - number: 5
    tool: progress.calculate_delta
    description: Calculate delta vs historical averages
    input_map:
      game_id: "{{ game_id }}"
      matches: "{{ step_3.matched_patterns }}"

outputs:
  - comparison_report
  - pattern_matches
  - delta_summary
