name: import_lichess_games
description: Import games from a Lichess account
trigger: manual
version: 1

parameters:
  - name: username
    type: string
    required: true
  - name: since_date
    type: string
    required: false
  - name: max_games
    type: integer
    required: false
    default: 50

steps:
  - number: 1
    tool: lichess_mcp.export_games
    description: Fetch games from Lichess since date (PGN format)
    input_map:
      username: "{{ username }}"
      since: "{{ since_date }}"
      max: "{{ max_games }}"

  - number: 2
    tool: pgn_parser.parse
    description: Parse PGN into individual games
    input_map:
      pgn_text: "{{ step_1.pgn }}"

  - number: 3
    tool: database.deduplicate
    description: Deduplicate against existing games in database
    input_map:
      games: "{{ step_2.games }}"
      source: lichess

  - number: 4
    tool: database.store_games
    description: Store new games with metadata
    input_map:
      games: "{{ step_3.new_games }}"
      source: lichess

  - number: 5
    tool: analysis.queue_batch
    description: Queue each new game for full_game_analysis
    input_map:
      game_ids: "{{ step_4.game_ids }}"

outputs:
  - import_summary
